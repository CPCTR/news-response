name = "my-llm-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# 同網域 API route（搭配 Pages + 一道 Cloudflare Access 全包）
routes = [
  { pattern = "response.example.com/api/*", zone_name = "example.com" }
]
workers_dev = false   # 鎖定：只能從 route(Access 後)進入；過渡期可暫設 true

[vars]
ALLOWED_ORIGIN = "https://response.example.com,https://my-proj.pages.dev"  # 可多來源逗號分隔
OPENROUTER_MODEL = "google/gemini-3-flash-preview"   # 主模型（OpenAI 相容）
GH_MODEL = "openai/gpt-5-chat"                        # GitHub Models（免費備援）
ANTHROPIC_MODEL = "claude-sonnet-4-6"                 # Anthropic 備援

# 機密用指令設定，勿寫這裡：
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put GITHUB_TOKEN        # models:read
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put APP_KEY             # 選用：x-app-key 共享密鑰
